[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "la-appraisal-engine"
version = "0.2.0"
description = "Los Angeles-specific real estate underwriting and appraisal engine with a consumer-facing API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.30",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["api", "core", "engine", "models", "reports", "services", "tools", "data_sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
